<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="340" height="70" fill="none">
  <defs>
    <!-- Rich Brand Gradients -->
    <linearGradient id="goldLuxeDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7DF94"/>
      <stop offset="50%" stop-color="#E9C46A"/>
      <stop offset="100%" stop-color="#C89D32"/>
    </linearGradient>
    <linearGradient id="greenLuxeDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D7566"/>
      <stop offset="50%" stop-color="#2F5D50"/>
      <stop offset="100%" stop-color="#21443A"/>
    </linearGradient>
    <filter id="softGlowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Architectural Nest & Hearth Mark -->
  <g transform="translate(8, 7)" filter="url(#softGlowDark)">
    <!-- Rounded Luxury Badge Base -->
    <rect x="0" y="0" width="56" height="56" rx="16" ry="16" fill="url(#greenLuxeDark)" />
    <!-- Fine Golden Inset Border -->
    <rect x="1.5" y="1.5" width="53" height="53" rx="14.5" ry="14.5" fill="none" stroke="url(#goldLuxeDark)" stroke-width="1.2" stroke-opacity="0.6" />

    <!-- Modern Architectural Home & Nesting Geometry -->
    <path d="M 28 12 L 44 26 L 44 43 L 12 43 L 12 26 Z" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="2.5" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>
    
    <!-- Golden Interior Living Vault / Archway -->
    <path d="M 21 43 L 21 31 C 21 27 35 27 35 31 L 35 43" 
          fill="none" 
          stroke="url(#goldLuxeDark)" 
          stroke-width="2.2" 
          stroke-linecap="round"/>
    
    <!-- Central Golden Hearth / Spark of Design -->
    <circle cx="28" cy="27" r="2.8" fill="url(#goldLuxeDark)" />
  </g>

  <!-- Luxury Typography (Light on Dark) -->
  <g transform="translate(76, 12)">
    <text x="0" y="29" 
          font-family="'Playfair Display', Didot, 'Cinzel', Georgia, serif" 
          font-size="27" 
          font-weight="700" 
          letter-spacing="0.5" 
          fill="#FFFFFF">
      Urban<tspan fill="#E9C46A" font-weight="600">Nest</tspan>
    </text>

    <!-- Subtitle: INTERIORS -->
    <text x="2" y="46" 
          font-family="'Poppins', 'Inter', -apple-system, sans-serif" 
          font-size="9" 
          font-weight="600" 
          letter-spacing="4.8px" 
          fill="#E9C46A">
      INTERIORS
    </text>

    <!-- Refined Architectural Accent Line -->
    <line x1="98" y1="43" x2="160" y2="43" stroke="url(#goldLuxeDark)" stroke-width="1" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>