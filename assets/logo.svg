<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80" fill="none">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D890"/>
      <stop offset="50%" stop-color="#E9C46A"/>
      <stop offset="100%" stop-color="#C29B38"/>
    </linearGradient>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A7061"/>
      <stop offset="100%" stop-color="#2F5D50"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#264653" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Architectural Nest Icon -->
  <g transform="translate(10, 10)">
    <!-- Outer Deep Green Hexagonal Arch / Roofline -->
    <path d="M 30 2 L 56 16 L 56 46 L 30 60 L 4 46 L 4 16 Z" 
          fill="none" 
          stroke="url(#greenGradient)" 
          stroke-width="3.5" 
          stroke-linejoin="round"/>
    
    <!-- Inner Nesting Geometric Lines (Warm Gold) -->
    <path d="M 30 11 L 47 21 L 47 41 L 30 51 L 13 41 L 13 21 Z" 
          fill="none" 
          stroke="url(#goldGradient)" 
          stroke-width="2.5" 
          stroke-linejoin="round"
          stroke-dasharray="1 0.5"/>

    <!-- Central Hearth / Living Diamond -->
    <polygon points="30,22 38,31 30,40 22,31" 
             fill="url(#goldGradient)" 
             filter="url(#subtleShadow)"/>

    <!-- Architectural Chimney / Elevation Accent -->
    <path d="M 21 8 L 21 3 L 26 3 L 26 11" 
          stroke="#E9C46A" 
          stroke-width="2" 
          stroke-linecap="round"/>
    
    <circle cx="30" cy="31" r="2.5" fill="#2F5D50"/>
  </g>

  <!-- Typography: UrbanNest -->
  <g transform="translate(78, 12)">
    <text x="0" y="32" 
          font-family="'Playfair Display', Georgia, serif" 
          font-size="28" 
          font-weight="700" 
          letter-spacing="0.8" 
          fill="#2F5D50">
      Urban<tspan fill="#E9C46A">Nest</tspan>
    </text>

    <!-- Tagline: INTERIORS -->
    <text x="2" y="49" 
          font-family="'Poppins', 'Inter', -apple-system, sans-serif" 
          font-size="9.5" 
          font-weight="600" 
          letter-spacing="5" 
          fill="#264653">
      INTERIORS
    </text>

    <!-- Subtle Golden Divider -->
    <line x1="102" y1="46" x2="168" y2="46" stroke="#E9C46A" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
